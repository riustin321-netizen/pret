name: Windows development package

on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - 'native/**'
      - 'tests/**'
      - 'tools/package.py'
      - 'third_party/**'
      - 'build-native.cmd'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'native/**'
      - 'tests/**'
      - 'tools/package.py'
      - 'third_party/**'
      - 'build-native.cmd'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test optional Python launcher
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Build browser model tests
        run: c++ -std=c++17 -Wall -Wextra -Werror -pedantic native/browser/model.cpp native/tests/browser_test.cpp -o /tmp/hellboost-browser-test
      - name: Test platform parsing, ranking and launch arguments
        run: /tmp/hellboost-browser-test
      - name: Check source packaging
        run: python tools/package.py
      - name: Build native library
        run: c++ -std=c++17 -Wall -Wextra -Werror -pedantic -fPIC -fvisibility=hidden -DHB_BUILD -shared native/hellboost_client.cpp -pthread -o /tmp/libHellBoostClient.so
      - name: Build ABI tests
        run: c++ -std=c++17 -Wall -Wextra -Werror -pedantic native/tests/abi_test.cpp -L/tmp -lHellBoostClient -Wl,-rpath,/tmp -pthread -o /tmp/hellboost-abi-test
      - name: Run ABI tests
        run: /tmp/hellboost-abi-test
  windows-x86:
    needs: portable-core
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x86
      - name: Test launcher and platform integration
        run: python -m unittest discover -s tests -v
      - name: Build native browser, DLL and tests
        shell: cmd
        run: build-native.cmd
      - name: Check native window startup and shutdown
        run: ./tools/smoke_windows.ps1
      - name: Package development build
        run: python tools/package.py --windows
      - uses: actions/upload-artifact@v4
        with:
          name: HellBoost-dev-windows-x86
          path: dist/HellBoost-dev-windows-x86.zip
          if-no-files-found: error
